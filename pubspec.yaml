name: fixly_gym
description: Next-Gen AI Gym Management SaaS Platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Backend & Database Integration
  supabase_flutter: ^2.5.4

  # Hardware & Web Rendering (Advanced HUD System)
  camera: ^0.11.0+1
  webview_flutter: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/hologram.html
    - assets/qr.jpeg